version: 2

models:

  - name: dim_date
    description: "Dimension ตารางวันที่สำหรับใช้วิเคราะห์ข้อมูลตามช่วงเวลา"
    columns:
      - name: date_key
        description: "Surrogate key ของวันที่ในรูปแบบ YYYYMMDD"
        data_tests:
          - not_null
          - unique

      - name: full_date
        description: "วันที่เต็ม"
        data_tests:
          - not_null
          - unique

      - name: day
        data_tests:
          - not_null

      - name: day_name
        data_tests:
          - not_null

      - name: week
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: month_name
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: is_weekend
        description: "ระบุว่าวันนั้นเป็นวันหยุดสุดสัปดาห์หรือไม่"
        data_tests:
          - not_null

      - name: day_type
        description: "ประเภทวัน แบ่งเป็น Weekday หรือ Weekend"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Weekday
                  - Weekend


  - name: dim_airport
    description: "Dimension ข้อมูลสนามบิน"
    columns:
      - name: airport_key
        data_tests:
          - not_null
          - unique

      - name: airport_code
        data_tests:
          - not_null
          - unique

      - name: airport_name
        data_tests:
          - not_null

      - name: city
        data_tests:
          - not_null

      - name: country
        description: "ประเทศที่สนามบินตั้งอยู่"
        data_tests:
          - not_null

      - name: analysis_region
        description: "ภูมิภาคที่ใช้สำหรับการวิเคราะห์"
        data_tests:
          - not_null

      - name: timezone
        data_tests:
          - not_null


  - name: dim_aircraft
    description: "Dimension ข้อมูลรุ่นเครื่องบิน"
    columns:
      - name: aircraft_key
        data_tests:
          - not_null
          - unique

      - name: aircraft_code
        data_tests:
          - not_null
          - unique

      - name: model
        data_tests:
          - not_null

      - name: manufacturer
        description: "บริษัทผู้ผลิตเครื่องบิน เช่น Boeing, Airbus"
        data_tests:
          - not_null

      - name: range
        data_tests:
          - not_null


  - name: dim_fare_class
    description: "Dimension ประเภทชั้นโดยสาร"
    columns:
      - name: fare_class_key
        data_tests:
          - not_null
          - unique

      - name: fare_class
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Business
                  - Comfort
                  - Economy


  - name: dim_flight_status
    description: "Dimension สถานะเที่ยวบิน"
    columns:
      - name: status_key
        data_tests:
          - not_null
          - unique

      - name: status_name
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Arrived
                  - Scheduled
                  - On Time
                  - Cancelled
                  - Departed
                  - Delayed


  - name: fact_ticket_sales
    description: "Fact table สำหรับยอดขายตั๋วที่ grain ระดับ 1 ticket ต่อ 1 flight segment"
    columns:
      - name: ticket_sales_key
        description: "Surrogate key ของ fact_ticket_sales"
        data_tests:
          - not_null
          - unique

      - name: ticket_no
        description: "หมายเลขตั๋ว"
        data_tests:
          - not_null

      - name: flight_id
        description: "รหัสเที่ยวบิน"
        data_tests:
          - not_null

      - name: date_key
        description: "Foreign key ไปยัง dim_date"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: departure_airport_key
        description: "Foreign key ของสนามบินต้นทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: arrival_airport_key
        description: "Foreign key ของสนามบินปลายทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: aircraft_key
        description: "Foreign key ไปยัง dim_aircraft"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: fare_class_key
        description: "Foreign key ไปยัง dim_fare_class"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fare_class')
                field: fare_class_key

      - name: amount
        description: "ยอดขายตั๋ว"
        data_tests:
          - not_null

      - name: booking_lead_days
        description: "จำนวนวันระหว่างวันที่จองกับวันที่เที่ยวบินออก"
        data_tests:
          - not_null

      - name: ticket_flight_count
        description: "Measure สำหรับนับจำนวน ticket-flight segment"
        data_tests:
          - not_null


  - name: fact_flight_operations
    description: "Fact table สำหรับการปฏิบัติการเที่ยวบิน โดย 1 แถวแทน 1 เที่ยวบิน"
    columns:
      - name: flight_operations_key
        description: "Surrogate key ของ fact_flight_operations"
        data_tests:
          - not_null
          - unique

      - name: flight_id
        description: "รหัสเที่ยวบิน"
        data_tests:
          - not_null
          - unique

      - name: flight_no
        description: "หมายเลขเที่ยวบิน"
        data_tests:
          - not_null

      - name: date_key
        description: "Foreign key ไปยัง dim_date"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: departure_airport_key
        description: "Foreign key ของสนามบินต้นทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: arrival_airport_key
        description: "Foreign key ของสนามบินปลายทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: aircraft_key
        description: "Foreign key ไปยัง dim_aircraft"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: status_key
        description: "Foreign key ไปยัง dim_flight_status"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flight_status')
                field: status_key

      - name: scheduled_departure
        description: "เวลาออกเดินทางตามกำหนด"

      - name: scheduled_arrival
        description: "เวลาถึงตามกำหนด"

      - name: actual_departure
        description: "เวลาออกเดินทางจริง"

      - name: actual_arrival
        description: "เวลาถึงจริง"

      - name: scheduled_departure_local
        description: "เวลาออกเดินทางตามกำหนดในเวลาท้องถิ่น"

      - name: scheduled_arrival_local
        description: "เวลาถึงตามกำหนดในเวลาท้องถิ่น"

      - name: departure_local_hour
        description: "ชั่วโมงออกเดินทางตามเวลาท้องถิ่น"

      - name: departure_daypart
        description: "ช่วงเวลาของวันของเที่ยวบินขาออก"
        data_tests:
          - not_null

      - name: departure_is_weekend
        description: "ระบุว่าเที่ยวบินออกในวันหยุดสุดสัปดาห์หรือไม่"
        data_tests:
          - not_null

      - name: scheduled_duration_minutes
        description: "ระยะเวลาเที่ยวบินตามกำหนด หน่วยเป็นนาที"

      - name: actual_duration_minutes
        description: "ระยะเวลาเที่ยวบินจริง หน่วยเป็นนาที"

      - name: departure_delay_minutes
        description: "จำนวนนาทีที่เที่ยวบินออกล่าช้า"

      - name: arrival_delay_minutes
        description: "จำนวนนาทีที่เที่ยวบินถึงล่าช้า"

      - name: scheduled_duration_over_2h
        description: "ระบุว่าเที่ยวบินตามกำหนดมีระยะเวลาเกิน 2 ชั่วโมงหรือไม่"

      - name: departure_delay_over_2h
        description: "ระบุว่าการออกเดินทางล่าช้าเกิน 2 ชั่วโมงหรือไม่"

      - name: arrival_delay_over_2h
        description: "ระบุว่าการถึงปลายทางล่าช้าเกิน 2 ชั่วโมงหรือไม่"

      - name: boarded_count
        description: "จำนวนผู้โดยสารที่ขึ้นเครื่องจริง"
        data_tests:
          - not_null

      - name: flight_count
        description: "Measure สำหรับนับจำนวนเที่ยวบิน"
        data_tests:
          - not_null


  - name: fact_seat_utilization
    description: >
      Fact table สำหรับวิเคราะห์การใช้ที่นั่งจริงในระดับเที่ยวบิน
      โดย 1 แถวแทน 1 เที่ยวบิน รองรับการวิเคราะห์ capacity,
      ticketed passengers, boarded passengers และ load percentage

    columns:
      - name: seat_utilization_key
        description: "Surrogate key ของ fact_seat_utilization"
        data_tests:
          - not_null
          - unique

      - name: flight_id
        description: "รหัสเที่ยวบิน"
        data_tests:
          - not_null
          - unique

      - name: date_key
        description: "Foreign key ไปยัง dim_date"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: departure_airport_key
        description: "Foreign key ของสนามบินต้นทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: arrival_airport_key
        description: "Foreign key ของสนามบินปลายทาง"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: aircraft_key
        description: "Foreign key ไปยัง dim_aircraft"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: seat_capacity
        description: "จำนวนที่นั่งทั้งหมดของเครื่องบิน"
        data_tests:
          - not_null

      - name: ticket_flight_count
        description: "จำนวนตั๋วที่มีในเที่ยวบิน"
        data_tests:
          - not_null

      - name: boarded_count
        description: "จำนวนผู้โดยสารที่ขึ้นเครื่องจริง"
        data_tests:
          - not_null

      - name: available_seats
        description: "จำนวนที่นั่งที่เหลือหลังจากผู้โดยสารขึ้นเครื่อง"

      - name: booked_not_boarded_count
        description: >
          ช่องว่างระหว่างจำนวนตั๋วกับจำนวนผู้โดยสารที่ขึ้นเครื่อง
          ใช้เป็น no-show proxy ไม่ใช่สถานะ no-show โดยตรง

      - name: ticketed_load_pct
        description: "อัตราการใช้ที่นั่งจากจำนวนตั๋วเทียบกับ capacity"

      - name: boarded_load_pct
        description: "อัตราการใช้ที่นั่งจริงจากผู้โดยสารที่ขึ้นเครื่องเทียบกับ capacity"

      - name: departure_daypart
        description: "ช่วงเวลาของวันของเที่ยวบินขาออก"

      - name: departure_is_weekend
        description: "ตัวบ่งชี้ว่าเที่ยวบินออกในวันหยุดสุดสัปดาห์หรือไม่"