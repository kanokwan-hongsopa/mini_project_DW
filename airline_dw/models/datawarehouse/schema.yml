version: 2

models:

  - name: dim_date
    description: "Dimension ตารางวันที่สำหรับใช้วิเคราะห์ข้อมูลตามช่วงเวลา"
    columns:
      - name: date_key
        description: "Surrogate key ของวันที่ในรูปแบบ YYYYMMDD"
        data_tests:
          - not_null
          - unique

      - name: full_date
        description: "วันที่เต็ม"
        data_tests:
          - not_null
          - unique

      - name: day
        data_tests:
          - not_null

      - name: day_name
        data_tests:
          - not_null

      - name: week
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: month_name
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null

      - name: year
        data_tests:
          - not_null  
  - name: dim_airport
    description: "Dimension ข้อมูลสนามบิน"
    columns:
      - name: airport_key
        data_tests:
          - not_null
          - unique

      - name: airport_code
        data_tests:
          - not_null
          - unique

      - name: airport_name
        data_tests:
          - not_null

      - name: city
        data_tests:
          - not_null

      - name: timezone
        data_tests:
          - not_null
  - name: dim_aircraft
    description: "Dimension ข้อมูลรุ่นเครื่องบิน"
    columns:
      - name: aircraft_key
        data_tests:
          - not_null
          - unique

      - name: aircraft_code
        data_tests:
          - not_null
          - unique

      - name: model
        data_tests:
          - not_null

      - name: range
        data_tests:
          - not_null
  - name: dim_fare_class
    description: "Dimension ประเภทชั้นโดยสาร"
    columns:
      - name: fare_class_key
        data_tests:
          - not_null
          - unique

      - name: fare_class
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Business
                  - Comfort
                  - Economy
  - name: dim_flight_status
    description: "Dimension สถานะเที่ยวบิน"
    columns:
      - name: status_key
        data_tests:
          - not_null
          - unique

      - name: status_name
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - Arrived
                  - Scheduled
                  - On Time
                  - Cancelled
                  - Departed
                  - Delayed
  - name: fact_ticket_sales
    description: "Fact table for ticket sales at ticket-flight segment grain"
    columns:
      - name: ticket_sales_key
        description: "Surrogate key for ticket sales fact"
        data_tests:
          - not_null
          - unique

      - name: ticket_no
        description: "Ticket number"
        data_tests:
          - not_null

      - name: flight_id
        description: "Flight identifier"
        data_tests:
          - not_null

      - name: date_key
        description: "Foreign key to date dimension"
        data_tests:
          - not_null

      - name: departure_airport_key
        description: "Foreign key to departure airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: arrival_airport_key
        description: "Foreign key to arrival airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: aircraft_key
        description: "Foreign key to aircraft dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: fare_class_key
        description: "Foreign key to fare class dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fare_class')
                field: fare_class_key

      - name: amount
        description: "Ticket sales amount"
        data_tests:
          - not_null

      - name: ticket_flight_count
        description: "Additive measure representing one ticket-flight segment"
        data_tests:
          - not_null


  - name: fact_flight_operations
    description: "Fact table for flight operations at one row per flight grain"
    columns:
      - name: flight_operations_key
        description: "Surrogate key for flight operations fact"
        data_tests:
          - not_null
          - unique

      - name: flight_id
        description: "Flight identifier"
        data_tests:
          - not_null
          - unique

      - name: date_key
        description: "Foreign key to date dimension"
        data_tests:
          - not_null

      - name: departure_airport_key
        description: "Foreign key to departure airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: arrival_airport_key
        description: "Foreign key to arrival airport"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key

      - name: aircraft_key
        description: "Foreign key to aircraft dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: status_key
        description: "Foreign key to flight status dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_flight_status')
                field: status_key

      - name: flight_count
        description: "Additive measure representing one flight"
        data_tests:
          - not_null


  - name: fact_seat_inventory
    description: "Fact table for seat inventory aggregated by aircraft and fare class"
    columns:
      - name: seat_inventory_key
        description: "Surrogate key for seat inventory fact"
        data_tests:
          - not_null
          - unique

      - name: aircraft_key
        description: "Foreign key to aircraft dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key

      - name: fare_class_key
        description: "Foreign key to fare class dimension"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fare_class')
                field: fare_class_key

      - name: seat_count
        description: "Number of seats for each aircraft and fare class"
        data_tests:
          - not_null