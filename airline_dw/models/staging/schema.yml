version: 2

models:

  - name: stg_bookings
    description: "Cleaned booking records"
    columns:
      - name: book_ref
        description: "Booking reference"
        data_tests:
          - not_null
          

      - name: book_date
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null

      - name: book_date_key
        data_tests:
          - not_null

      - name: book_day_name
        data_tests:
          - not_null

      - name: book_is_weekend
        data_tests:
          - not_null

      - name: book_day_type
        data_tests:
          - not_null


  - name: stg_tickets
    description: "Cleaned passenger ticket records"
    columns:
      - name: ticket_no
        data_tests:
          - not_null
          - unique

      - name: book_ref
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_bookings')
                field: book_ref

      - name: passenger_id
        data_tests:
          - not_null

      - name: book_date
        data_tests:
          - not_null

      - name: book_date_key
        data_tests:
          - not_null

      - name: book_day_type
        data_tests:
          - not_null


  - name: stg_ticket_flights
    description: "Cleaned ticket-flight segment transactions"
    columns:
      - name: ticket_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tickets')
                field: ticket_no

      - name: flight_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_flights')
                field: flight_id

      - name: fare_conditions
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Business
                  - Comfort
                  - Economy

      - name: amount
        data_tests:
          - not_null

      - name: book_ref
        data_tests:
          - not_null

      - name: book_date
        data_tests:
          - not_null

      - name: flight_date
        data_tests:
          - not_null

      - name: booking_lead_days
        data_tests:
          - not_null

      - name: departure_airport
        data_tests:
          - not_null

      - name: arrival_airport
        data_tests:
          - not_null

      - name: departure_region
        data_tests:
          - not_null

      - name: arrival_region
        data_tests:
          - not_null

      - name: aircraft_code
        data_tests:
          - not_null

      - name: aircraft_model
        data_tests:
          - not_null

      - name: manufacturer
        data_tests:
          - not_null

      - name: scheduled_duration_minutes
        data_tests:
          - not_null


  - name: stg_aircrafts
    description: "Cleaned aircraft master data"
    columns:
      - name: aircraft_code
        data_tests:
          - not_null
          - unique

      - name: model
        data_tests:
          - not_null

      - name: range
        data_tests:
          - not_null

      - name: manufacturer
        data_tests:
          - not_null


  - name: stg_airports
    description: "Cleaned airport master data"
    columns:
      - name: airport_code
        data_tests:
          - not_null
          - unique

      - name: airport_name
        data_tests:
          - not_null

      - name: city
        data_tests:
          - not_null

      - name: timezone
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null

      - name: analysis_region
        data_tests:
          - not_null


  - name: stg_flights
    description: "Cleaned flight schedule and operational records"
    columns:
      - name: flight_id
        data_tests:
          - not_null
          - unique

      - name: flight_no
        data_tests:
          - not_null

      - name: scheduled_departure
        data_tests:
          - not_null

      - name: scheduled_arrival
        data_tests:
          - not_null

      - name: departure_airport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_airports')
                field: airport_code

      - name: arrival_airport
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_airports')
                field: airport_code

      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Arrived
                  - Scheduled
                  - On Time
                  - Cancelled
                  - Departed
                  - Delayed

      - name: aircraft_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aircrafts')
                field: aircraft_code

      - name: departure_region
        data_tests:
          - not_null

      - name: arrival_region
        data_tests:
          - not_null

      - name: aircraft_model
        data_tests:
          - not_null

      - name: manufacturer
        data_tests:
          - not_null

      - name: scheduled_duration_minutes
        data_tests:
          - not_null

      - name: departure_daypart
        data_tests:
          - not_null

      - name: departure_is_weekend
        data_tests:
          - not_null

      - name: seat_capacity
        data_tests:
          - not_null

      - name: ticket_flight_count
        data_tests:
          - not_null

      - name: boarded_count
        data_tests:
          - not_null


  - name: stg_seats
    description: "Cleaned aircraft seating configuration"
    columns:
      - name: aircraft_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_aircrafts')
                field: aircraft_code

      - name: seat_no
        data_tests:
          - not_null

      - name: fare_conditions
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Business
                  - Comfort
                  - Economy

      - name: aircraft_model
        data_tests:
          - not_null

      - name: manufacturer
        data_tests:
          - not_null

      - name: total_seat_capacity
        data_tests:
          - not_null


  - name: stg_boarding_passes
    description: "Cleaned passenger boarding pass records"
    columns:
      - name: ticket_no
        data_tests:
          - not_null

      - name: flight_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_flights')
                field: flight_id

      - name: boarding_no
        data_tests:
          - not_null

      - name: seat_no
        data_tests:
          - not_null

      - name: departure_airport
        data_tests:
          - not_null

      - name: arrival_airport
        data_tests:
          - not_null

      - name: departure_region
        data_tests:
          - not_null

      - name: arrival_region
        data_tests:
          - not_null

      - name: aircraft_code
        data_tests:
          - not_null

      - name: aircraft_model
        data_tests:
          - not_null

      - name: manufacturer
        data_tests:
          - not_null

      - name: seat_capacity
        data_tests:
          - not_null